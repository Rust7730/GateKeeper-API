# Alembic de Gatekeeper. Aquí no va la URL: env.py la lee con url_migraciones() desde
# GATEKEEPER_DATABASE_URL_MIGRACION, sin valor por defecto. Uso, desde cualquier carpeta:
#   uv run alembic -c api/migrations/alembic.ini upgrade head
[alembic]
script_location = %(here)s
version_locations = %(here)s/versions
prepend_sys_path = %(here)s/../..
path_separator = os
