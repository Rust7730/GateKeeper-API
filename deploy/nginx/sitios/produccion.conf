# Producción: HTTPS con el certificado de Let's Encrypt. El certificado se emite con --cert-name
# gatekeeper, así que su ruta no depende del dominio: aquí no hay ningún nombre escrito a mano.

# El puerto 80 (desafío de Let's Encrypt y redirección) lo sirve nginx-http, aparte (http.conf).

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/gatekeeper/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gatekeeper/privkey.pem;

    # Perfil "intermediate" de Mozilla: TLS 1.2 y 1.3, solo cifrados AEAD con ECDHE.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:2m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/gatekeeper/cabeceras.conf;
    # Sin includeSubDomains ni preload: el nombre es de sslip.io y depende de la IP elástica.
    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/gatekeeper/errores.conf;
    include /etc/nginx/gatekeeper/rutas.conf;
}
