# Errores que genera nginx, con el mismo formato genérico que la API: {"detail": "<texto HTTP>"} (K29).
# Las respuestas de error de la API pasan sin cambios (proxy_intercept_errors está apagado).
error_page 400 @e400;
# 494: cabecera demasiado grande; 497: HTTP plano en el puerto TLS. Sin esto, nginx da su página HTML.
error_page 494 497 =400 @e400;
error_page 404 @e404;
error_page 405 @e405;
error_page 408 @e408;
error_page 413 @e413;
error_page 414 @e414;
error_page 500 @e500;
error_page 502 503 504 @e503;

location @e400 { default_type application/json; return 400 '{"detail":"Bad Request"}\n'; }
location @e404 { default_type application/json; return 404 '{"detail":"Not Found"}\n'; }
location @e405 { default_type application/json; return 405 '{"detail":"Method Not Allowed"}\n'; }
location @e408 { default_type application/json; return 408 '{"detail":"Request Timeout"}\n'; }
location @e413 { default_type application/json; return 413 '{"detail":"Request Entity Too Large"}\n'; }
location @e414 { default_type application/json; return 414 '{"detail":"Request-URI Too Long"}\n'; }
location @e500 { default_type application/json; return 500 '{"detail":"Internal Server Error"}\n'; }
location @e503 { default_type application/json; return 503 '{"detail":"Service Unavailable"}\n'; }
