[project]
name = "gatekeeper"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.1",
    "psycopg[binary]==3.3.6",
    "sqlalchemy[asyncio]==2.0.55",
]

[tool.pytest.ini_options]
testpaths = ["tests", "api"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "detect-secrets==1.5.0",
    "pytest==9.2.0",
    "pyyaml==6.0.3",
    "ruff==0.17.3",
    "testcontainers[postgres]==4.15.0",
]

[tool.ruff]
extend-exclude = ["docs", "context"]
