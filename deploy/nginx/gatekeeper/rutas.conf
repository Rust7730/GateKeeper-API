# Lista blanca de rutas hacia la API y entrega estática del dashboard SPA (mismo origen).

# SSE del dashboard en tiempo real (F5.11): sin búfer (proxy.conf) y timeout largo.
location = /v1/admin/events {
    include /etc/nginx/gatekeeper/proxy.conf;
    proxy_read_timeout 3600s;
}

location /v1/ {
    include /etc/nginx/gatekeeper/proxy.conf;
}

location = /health {
    include /etc/nginx/gatekeeper/proxy.conf;
}

# K29: la API solo sirve /openapi.json con GATEKEEPER_DOCS=1 y responde 404 en otro caso. nginx no
# duplica la decisión: la única fuente es esa variable, que /etc/gatekeeper/api.env no define.
location = /openapi.json {
    include /etc/nginx/gatekeeper/proxy.conf;
}

# Assets estáticos con hash de Angular: caché inmutable, sin fallback a index.html si faltan.
location ~* \.(?:js|mjs|css|woff2?|svg|png|ico|webp)$ {
    root /usr/share/nginx/html;
    include /etc/nginx/gatekeeper/cabeceras-spa.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Dashboard SPA (GateKeeper-Frontend). Si no hay build desplegado (/usr/share/nginx/html/index.html
# no existe), devuelve 404 como antes.
location / {
    root /usr/share/nginx/html;
    include /etc/nginx/gatekeeper/cabeceras-spa.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ @spa_fallback;
}

location @spa_fallback {
    root /usr/share/nginx/html;
    include /etc/nginx/gatekeeper/cabeceras-spa.conf;
    add_header Cache-Control "no-cache" always;
    if (!-f /usr/share/nginx/html/index.html) {
        return 404;
    }
    rewrite ^ /index.html break;
}
