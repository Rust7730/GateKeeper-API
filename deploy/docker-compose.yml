# Producción de Gatekeeper en una instancia EC2 (K55). Se usa a través de `gk-compose`, que instala
# deploy/instalar.sh y le pasa /etc/gatekeeper/compose.env y /var/lib/gatekeeper/imagen.env.
#
# Servicios: nginx (443, TLS y la API), nginx-http (80: solo el desafío de Let's Encrypt y la redirección,
# con su propio pool de conexiones), api, postgres, redis-main (contadores del rate limit, K59), migrate
# (perfil `migrar`, una sola ejecución), sonda (perfil `sonda`, sin red ni secretos) y certbot (perfil
# `certbot`, lo lanza un timer de systemd). Solo los dos nginx publican puertos.
#
# Redes: `publica` (los puertos), `frontend` (nginx y api, interna, con subred fija: la API solo confía
# en el X-Forwarded-For de la IP fija de nginx), `backend` (api, postgres, redis-main y migrate, interna)
# y `acme` (solo certbot, con salida a Let's Encrypt). La API no tiene salida a internet.
#
# Memoria (t3.small, 2 GiB): api 1 GiB (uvicorn ~100 MiB + 2 hijos del CDR; RLIMIT_AS de 1 GiB por hijo,
# K31, pero un JPEG o PNG de 40 MP pesa ~330 MiB de RSS medidos), postgres 256 MiB, redis-main 64 MiB,
# nginx 64 MiB, nginx-http 32 MiB y certbot 192 MiB solo mientras renueva. Queda ~0.45 GiB para el
# sistema y Docker.
# Si un hijo se pasa, el OOM del cgroup mata al proceso más grande (un hijo) y el archivo queda en
# `error` (INV-09).
#
# Sin secretos aquí: llegan por env_file y por la configuración de redis-main desde /etc/gatekeeper/
# (fuera del repo, legibles solo por root o por el usuario del contenedor que los usa).

name: gatekeeper

x-endurecido: &endurecido
  read_only: true
  cap_drop: [ALL]
  # Perfil seccomp por defecto de Docker: permite landlock_* (444-446), seccomp() y prctl, que necesita
  # el hijo del CDR (K53, K54). Comprobado en la verificación; nunca `seccomp=unconfined` ni `privileged`.
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  nginx:
    <<: *endurecido
    image: nginx:1.30.7-alpine@sha256:b24de00298eb7fb23839442d46c780991be7bc7ddb081b6c0876ac777012e352
    # Sin el entrypoint de la imagen: sus scripts intentan reescribir la configuración.
    entrypoint: ["nginx", "-g", "daemon off;"]
    # El maestro lee los certificados como root y baja a `nginx` en los workers; crea y da a ese
    # usuario sus directorios temporales. Nada más.
    cap_add: [CHOWN, SETGID, SETUID]
    # Solo 443: el puerto 80, abierto a todo internet, va en nginx-http y no comparte sus conexiones.
    ports:
      - "443:443"
    networks:
      publica: {}
      frontend:
        # Fija y fuera del rango dinámico de la red: es la única IP de la que la API acepta
        # X-Forwarded-For (ver `api`). nginx lo reescribe siempre con $remote_addr (proxy.conf).
        ipv4_address: 172.29.80.2
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/gatekeeper:/etc/nginx/gatekeeper:ro
      - ./nginx/sitios/produccion.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dashboard:/usr/share/nginx/html:ro
      - letsencrypt:/etc/letsencrypt:ro
    tmpfs:
      - /var/cache/nginx:size=16m
      - /tmp:size=8m
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 64m
    memswap_limit: 64m
    pids_limit: 32

  # Puerto 80: el desafío HTTP-01 de Let's Encrypt y la redirección al dominio fijo. Contenedor aparte,
  # con su propio pool y timeouts cortos: conexiones a medias aquí no tumban el 443. No habla con la API.
  # También sirve el desafío del primer certificado, cuando el nginx del 443 aún no puede arrancar.
  nginx-http:
    <<: *endurecido
    image: nginx:1.30.7-alpine@sha256:b24de00298eb7fb23839442d46c780991be7bc7ddb081b6c0876ac777012e352
    entrypoint: ["nginx", "-g", "daemon off;"]
    cap_add: [CHOWN, SETGID, SETUID]
    ports:
      - "80:80"
    networks: [publica]
    volumes:
      - ./nginx/http.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/gatekeeper:/etc/nginx/gatekeeper:ro
      # `server_name <dominio>;`, lo escribe instalar.sh: la redirección nunca usa el Host del cliente.
      - ./nginx/generado/dominio.conf:/etc/nginx/generado/dominio.conf:ro
      - certbot_www:/var/www/certbot:ro
    tmpfs:
      - /var/cache/nginx:size=8m
      - /tmp:size=8m
    mem_limit: 32m
    memswap_limit: 32m
    pids_limit: 16

  api:
    <<: *endurecido
    image: ${GATEKEEPER_IMAGEN:?Define GATEKEEPER_IMAGEN (lo hace gk-compose)}
    user: "10001:10010"
    # Sin `init: true`: tini sería el padre de uvicorn con el pepper y las URL de la BD y de Redis en
    # su entorno, y la API se negaría a arrancar (K52). uvicorn es el PID 1, en forma exec: el mismo
    # comando que el CMD de la imagen, más la IP del cliente desde nginx. --proxy-headers solo vale
    # para conexiones de 172.29.80.2 (nginx); de cualquier otra, la API usa la IP de la conexión.
    command:
      - /app/.venv/bin/uvicorn
      - --factory
      - api.app.principal:crear_app
      - --no-server-header
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=172.29.80.2
    # api.env: el pepper y GATEKEEPER_REDIS_URL. api-bd.env: GATEKEEPER_DATABASE_URL, que escribe
    # actualizar.sh antes de cada arranque: el rol gk_app (permisos mínimos) o, solo con un esquema
    # anterior a la migración 0002, el dueño. La URL del dueño la usan solo `migrate` y el respaldo.
    # api-bd.env está en el directorio de estado (0700, root): el timer no puede escribir en /etc.
    env_file:
      - ${GATEKEEPER_ETC:-/etc/gatekeeper}/api.env
      - ${GATEKEEPER_ESTADO:-/var/lib/gatekeeper}/api-bd.env
    environment:
      GATEKEEPER_DATOS: /datos
    volumes:
      # K64 / F1.04: la API escribe uploads_tmp y solo lee clean_store (nunca escribe en clean_store).
      - uploads_tmp:/datos/uploads_tmp
      - clean_store:/datos/clean_store:ro
    tmpfs:
      - /tmp:size=64m
    networks: [frontend, backend]
    depends_on:
      postgres:
        condition: service_healthy
      redis-main:
        condition: service_healthy
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 64
    stop_grace_period: 20s

  # Orquestador de análisis (K01, K08, F1.05): consume `orquestar` de redis-main, encola `analizar`
  # en redis-queue hacia el worker, valida el resultado y escribe en PostgreSQL como `gk_app`.
  coordinator:
    <<: *endurecido
    image: ${GATEKEEPER_IMAGEN:?Define GATEKEEPER_IMAGEN (lo hace gk-compose)}
    user: "10001:10010"
    command: ["/app/.venv/bin/python", "-m", "api.app.coordinador"]
    env_file:
      - ${GATEKEEPER_ETC:-/etc/gatekeeper}/api.env
      - ${GATEKEEPER_ESTADO:-/var/lib/gatekeeper}/api-bd.env
      - ${GATEKEEPER_ETC:-/etc/gatekeeper}/cola.env
    environment:
      GATEKEEPER_DATOS: /datos
    volumes:
      - uploads_tmp:/datos/uploads_tmp
      - clean_store:/datos/clean_store
      - quarantine:/datos/quarantine
    tmpfs:
      - /tmp:size=16m
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
      redis-main:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    healthcheck:
      disable: true
    mem_limit: 192m
    memswap_limit: 192m
    pids_limit: 64
    stop_grace_period: 20s

  # Worker aislado de CDR + ClamAV (INV-04, F1.03, K09, K64, D1): único contenedor que abre
  # archivos no confiables. Sin internet, sin acceso a PostgreSQL ni a redis-main, UID propio
  # (10003), uploads_tmp en solo lectura y proceso hijo con RLIMIT_AS, RLIMIT_CPU, Landlock y seccomp.
  worker:
    <<: *endurecido
    image: ${GATEKEEPER_IMAGEN:?Define GATEKEEPER_IMAGEN (lo hace gk-compose)}
    user: "10003:10010"
    command: ["/app/.venv/bin/python", "-m", "worker.principal"]
    env_file:
      - ${GATEKEEPER_ETC:-/etc/gatekeeper}/worker.env
    environment:
      GATEKEEPER_DATOS: /datos
      GATEKEEPER_CLAMAV_HOST: clamav
      GATEKEEPER_CLAMAV_PORT: "3310"
    volumes:
      - uploads_tmp:/datos/uploads_tmp:ro
      - clean_store:/datos/clean_store
      - quarantine:/datos/quarantine
    tmpfs:
      - /tmp:size=64m
    networks: [isolated]
    depends_on:
      redis-queue:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      disable: true
    # Sin swap: un hijo que se pasa muere y su archivo termina en `error`, en vez de arrastrar al resto.
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 128
    stop_grace_period: 20s

  # Demonio clamd aislado sin salida a internet (D1, D2, F4.01, K65): lee las firmas que descarga
  # freshclam en clamav_db (:ro) y escanea originales por INSTREAM en el puerto 3310.
  # Sin /init de la imagen: /init corre como root e intenta `chown /var/lib/clamav`, que falla con :ro.
  clamav:
    <<: *endurecido
    image: clamav/clamav:1.4.2_base@sha256:26a576bbed25fe1de510891ff54697c161124050a03e1c5d59b5b9bdf21c3366
    user: "100:101"
    entrypoint: ["clamd", "--foreground"]
    volumes:
      - clamav_db:/var/lib/clamav:ro
    tmpfs:
      - /run/clamav:size=8m,uid=100,gid=101,mode=0755
      - /tmp:size=64m
    networks: [isolated]
    healthcheck:
      test: ["CMD-SHELL", "printf 'PING\n' | nc -w 3 127.0.0.1 3310 | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: 2560m
    memswap_limit: 2560m
    pids_limit: 64

  # Actualizador separado de firmas de ClamAV (D2, F4.01): único servicio ClamAV con salida a internet.
  # Corre como usuario no-root `clamav` (100:101) con rootfs read_only y sin capacidades.
  freshclam:
    <<: *endurecido
    image: clamav/clamav:1.4.2_base@sha256:26a576bbed25fe1de510891ff54697c161124050a03e1c5d59b5b9bdf21c3366
    user: "100:101"
    entrypoint: ["freshclam", "--daemon", "--foreground", "--stdout"]
    volumes:
      - clamav_db:/var/lib/clamav
    tmpfs:
      - /run/clamav:size=8m,uid=100,gid=101,mode=0755
      - /tmp:size=16m
    networks: [egress]
    healthcheck:
      disable: true
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 32

  # Servicio de reputación VirusTotal solo por hash SHA-256 (INV-05, F4.03-F4.08, D3, K07, K65).
  # Sin BD y sin volúmenes de archivos: nunca toca ni envía ningún archivo.
  reputation:
    <<: *endurecido
    image: ${GATEKEEPER_IMAGEN:?Define GATEKEEPER_IMAGEN (lo hace gk-compose)}
    user: "10001:10010"
    command: ["/app/.venv/bin/python", "-m", "reputation.principal"]
    env_file:
      - ${GATEKEEPER_ETC:-/etc/gatekeeper}/api.env
      - ${GATEKEEPER_ETC:-/etc/gatekeeper}/reputation.env
    tmpfs:
      - /tmp:size=16m
    networks: [backend, egress]
    depends_on:
      redis-main:
        condition: service_healthy
    healthcheck:
      disable: true
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 32

  postgres:
    <<: *endurecido
    image: postgres:16.16-bookworm@sha256:a49f7438ba03589f9b1ca062f2da82e899b48ea1dc50d2449fa09a70be83ebca
    # Directamente como `postgres`: el entrypoint no necesita root ni capacidades para cambiar de usuario.
    user: "999:999"
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=40
    env_file:
      - ${GATEKEEPER_ETC:-/etc/gatekeeper}/postgres.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    tmpfs:
      - /var/run/postgresql:size=1m,uid=999,gid=999,mode=0770
      - /tmp:size=16m
    shm_size: 64m
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -q"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 100
    stop_grace_period: 30s

  # Contadores del rate limit (K10, K58, K59). Es el redis-main de K02: solo en `backend`, sin puertos,
  # sin persistencia y sin acceso sin contraseña. El worker nunca llega aquí (K02, INV-04).
  redis-main:
    <<: *endurecido
    image: redis:8.10.3-alpine3.23@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    # Sin el entrypoint de la imagen: arranca como root para cambiar dueños y permisos y puede cargar
    # módulos. redis-server directo, ya como usuario sin privilegios (UID reservado en el host).
    entrypoint: ["redis-server"]
    user: "10002:10002"
    # El primer argumento es la configuración con los usuarios (ACL), que genera instalar.sh: dueño
    # 10002 y modo 0400. Guarda solo el SHA-256 de la contraseña, que no aparece en `docker inspect`
    # ni en la línea de comandos. `default` queda desactivado: sin AUTH no se ejecuta ningún comando.
    #
    # maxmemory 32mb con noeviction: los contadores son exactos o no hay respuesta. Con una política
    # que desaloja (volatile-ttl, allkeys-*), llenar la memoria con claves de muchas IP borraría los
    # contadores de otros y les dejaría pasar más de lo permitido. Con noeviction, al llegar al tope
    # Redis rechaza las escrituras y la API responde 503 (falla cerrado); las claves llevan TTL de un
    # minuto, así que la memoria se libera sola. 32 MiB caben del orden de 10^5 contadores.
    command:
      - /etc/redis/gatekeeper.conf
      - --port
      - "6379"
      - --dir
      - /data
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 32mb
      - --maxmemory-policy
      - noeviction
      - --protected-mode
      - "yes"
      - --enable-debug-command
      - "no"
      - --enable-module-command
      - "no"
      - --enable-protected-configs
      - "no"
    volumes:
      - ${GATEKEEPER_ETC:-/etc/gatekeeper}/redis.conf:/etc/redis/gatekeeper.conf:ro
    tmpfs:
      # Directorio de trabajo vacío: no se escribe nada (sin RDB ni AOF).
      - /data:size=1m,uid=10002,gid=10002,mode=0700
      - /tmp:size=1m
    networks: [backend]
    # Usuario `salud` sin contraseña que solo puede hacer PING: el healthcheck no necesita el secreto.
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning --user salud --pass salud ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 64m
    memswap_limit: 64m
    pids_limit: 32

  # Cola aislada entre coordinator y worker (K02, F1.02): solo lleva los jobs `analizar`.
  # Un worker comprometido nunca ve los contadores del rate limit ni la caché de VT (redis-main).
  redis-queue:
    <<: *endurecido
    image: redis:8.10.3-alpine3.23@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    entrypoint: ["redis-server"]
    user: "10002:10002"
    command:
      - /etc/redis/gatekeeper-queue.conf
      - --port
      - "6379"
      - --dir
      - /data
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 32mb
      - --maxmemory-policy
      - noeviction
      - --protected-mode
      - "yes"
      - --enable-debug-command
      - "no"
      - --enable-module-command
      - "no"
      - --enable-protected-configs
      - "no"
    volumes:
      - ${GATEKEEPER_ETC:-/etc/gatekeeper}/redis-queue.conf:/etc/redis/gatekeeper-queue.conf:ro
    tmpfs:
      - /data:size=1m,uid=10002,gid=10002,mode=0700
      - /tmp:size=1m
    networks: [backend, isolated]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning --user salud --pass salud ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 64m
    memswap_limit: 64m
    pids_limit: 32

  migrate:
    <<: *endurecido
    image: ${GATEKEEPER_IMAGEN:?Define GATEKEEPER_IMAGEN (lo hace gk-compose)}
    profiles: [migrar]
    restart: "no"
    user: "10001:10001"
    # Solo la URL de migración (rol dueño del esquema). La API usa gk_app (api-bd.env).
    env_file:
      - ${GATEKEEPER_ETC:-/etc/gatekeeper}/migrate.env
    command: ["/app/.venv/bin/alembic", "-c", "api/migrations/alembic.ini", "upgrade", "head"]
    healthcheck:
      disable: true
    tmpfs:
      - /tmp:size=16m
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 32

  # Sonda del aislamiento (deploy/sonda_aislamiento.py) con la misma imagen y el mismo endurecimiento que
  # la API, pero sin red, sin secretos y sin el volumen de datos. La corre actualizar.sh tras verificar
  # la firma de la imagen.
  sonda:
    <<: *endurecido
    image: ${GATEKEEPER_IMAGEN:?Define GATEKEEPER_IMAGEN (lo hace gk-compose)}
    profiles: [sonda]
    restart: "no"
    user: "10001:10001"
    network_mode: none
    healthcheck:
      disable: true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 32

  certbot:
    <<: *endurecido
    image: certbot/certbot:v5.10.0@sha256:c5698da859429ccee0fcc299a8000368198222d1f9e789ab6e388b491e8ce06d
    profiles: [certbot]
    restart: "no"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    tmpfs:
      - /var/lib/letsencrypt:size=16m
      - /var/log/letsencrypt:size=16m
      - /tmp:size=16m
    # Red propia con salida a internet: habla con Let's Encrypt y con nada de Gatekeeper.
    networks: [acme]
    mem_limit: 192m
    memswap_limit: 192m
    pids_limit: 32

networks:
  # Con salida a internet solo `publica` (los puertos publicados de los dos nginx) y `acme` (certbot).
  publica: {}
  # Internas, sin salida a internet: nginx con api, y api con postgres, redis-main y migrate.
  # `frontend` con subred fija: nginx tiene 172.29.80.2, fuera de `ip_range`, que es de donde Docker
  # da las direcciones dinámicas (la API). No se cruza con la VPC por defecto de AWS (172.31.0.0/16), y
  # las redes que Docker numera solo van en orden desde 172.17.0.0/16: con las de este proyecto no llegan
  # a 172.29. Si otra red ya la ocupara, el compose no arranca y lo dice.
  frontend:
    internal: true
    ipam:
      config:
        - subnet: 172.29.80.0/28
          ip_range: 172.29.80.8/29
  backend:
    internal: true
  isolated:
    internal: true
  egress: {}
  acme: {}

volumes:
  uploads_tmp: {}
  clean_store: {}
  quarantine: {}
  clamav_db: {}
  pgdata: {}
  letsencrypt: {}
  certbot_www: {}
