[project]
name = "gatekeeper"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "arq==0.25.0",
    "cryptography==50.0.2",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "pikepdf==10.17.0",
    "pillow==13.0.0",
    "psycopg[binary]==3.3.6",
    "pyjwt==2.15.1",
    "pyotp==2.12.1",
    "python-magic==0.4.27",
    "python-multipart==0.0.32",
    "redis==8.1.0",
    "sqlalchemy[asyncio]==2.0.55",
    "uvicorn[standard]==0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "api"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "detect-secrets==1.5.0",
    "pytest==9.2.0",
    "pyyaml==6.0.3",
    "ruff==0.17.3",
    "testcontainers[postgres,redis]==4.15.0",
]

[tool.ruff]
extend-exclude = ["docs", "context"]
