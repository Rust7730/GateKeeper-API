# nginx de Gatekeeper (F2.08, K29, K40, K41, K55). Único servicio con puertos publicados.
# El sitio (TLS en producción, HTTP en la prueba local) se monta en /etc/nginx/conf.d/default.conf.

user nginx;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # K29: no anunciar la versión. nginx de código abierto sigue enviando `Server: nginx` (sin versión);
    # quitarlo del todo exige el módulo headers-more, que la imagen oficial no trae.
    server_tokens off;

    # Nunca se registran cabeceras (Authorization lleva la API key) ni cuerpos.
    log_format gatekeeper '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent $request_length $request_time '
                          '$upstream_response_time';
    access_log /dev/stdout gatekeeper;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 15s;

    # K41: la API acepta como mucho 10 485 760 bytes de archivo + 65 536 de multipart. Con el mismo tope
    # aquí, un archivo legítimo de 10 MiB pasa y lo que no cabe recibe 413 sin llegar a la API (vec:10).
    client_max_body_size 10551296;
    client_body_buffer_size 64k;
    large_client_header_buffers 4 8k;

    # K40: la API corta toda subida a los 60 s (tiempo total). nginx no tiene un tope total del cuerpo,
    # solo entre lecturas: con estos valores, el 408 de la API llega antes que cualquier corte de nginx.
    client_header_timeout 10s;
    client_body_timeout 60s;
    send_timeout 60s;

    # DNS de Docker: si el contenedor de la API se recrea con otra IP (una actualización), nginx la sigue
    # en 2 s como mucho.
    resolver 127.0.0.11 valid=2s ipv6=off;
    resolver_timeout 5s;

    upstream api {
        zone api 64k;
        server api:8000 resolve;
        keepalive 8;
    }

    include /etc/nginx/conf.d/*.conf;
}
