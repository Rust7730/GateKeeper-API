# Headers de seguridad para el dashboard SPA (GateKeeper-Frontend, mismo origen).
# En nginx, cualquier `add_header` en un bloque `location` anula los heredados de `server`, así que
# aquí se repiten todos los headers de seguridad más HSTS (solo en HTTPS vía $gk_hsts).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Strict-Transport-Security $gk_hsts always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
