# SOLO para probar el despliegue en una máquina local, sin TLS ni dominio. Nunca en el servidor.
#
#   GATEKEEPER_IMAGEN=gatekeeper-api:prueba GATEKEEPER_ETC=<dir con api.env, postgres.env y migrate.env> \
#     docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml up -d
#
# nginx (la API) escucha en 127.0.0.1:8080 con HTTP y no necesita certificado; nginx-http, en
# 127.0.0.1:8081 con el dominio `localhost`.
services:
  nginx:
    ports: !override
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/sitios/local.conf:/etc/nginx/conf.d/default.conf:ro

  nginx-http:
    ports: !override
      - "127.0.0.1:8081:80"
    volumes:
      - ./nginx/sitios/dominio-local.conf:/etc/nginx/generado/dominio.conf:ro
