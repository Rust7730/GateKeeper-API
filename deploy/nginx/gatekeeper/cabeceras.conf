# Headers de seguridad en toda respuesta, también en los errores que genera nginx (`always`).
# Los mismos valores que pone la API (api/app/seguridad.py); en las respuestas de la API, proxy.conf
# oculta los suyos para que cada header salga una sola vez.
# Se incluye a nivel de `server`: las `location` no llevan `add_header`, así que todas los heredan.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
add_header Cache-Control "no-store" always;
