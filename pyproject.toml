[project]
name = "gatekeeper"
version = "0.0.0"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests", "api"]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "pytest==9.2.0",
    "pyyaml==6.0.3",
    "ruff==0.17.3",
]

[tool.ruff]
extend-exclude = ["docs", "context"]
