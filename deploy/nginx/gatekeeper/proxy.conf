# Paso a la API.
proxy_pass http://api;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# Se reemplazan, no se encadenan: el cliente no puede inyectar una IP falsa por aquí.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# Petición sin búfer: el cuerpo pasa a la API mientras llega. Así siguen valiendo los controles de la
# API que actúan antes de leer el cuerpo (401 sin leerlo, 429 de K48, 413 por Content-Length) y su tope
# de 60 s sobre toda la recepción (K40). Con búfer, nginx recibiría 10 MiB de cualquiera, sin
# autenticar, y los guardaría en su directorio temporal, que aquí es tmpfs (RAM de una máquina de 2 GiB).
proxy_request_buffering off;

# Respuesta sin búfer: las respuestas JSON son pequeñas y la API es asíncrona (un cliente lento le
# cuesta una corrutina, no un hilo). Con búfer, nginx copiaría los archivos reconstruidos (hasta
# 32 MiB, K46) a su temporal en RAM. Hará falta igual para el SSE del dashboard (diseño §2).
proxy_buffering off;

# La API corta la recepción a los 60 s (K40) y responde enseguida; 75 s deja que su 408 llegue antes
# que un 504 de nginx.
proxy_connect_timeout 5s;
proxy_send_timeout 75s;
proxy_read_timeout 75s;

# Un POST no es idempotente: nunca se reintenta contra la API.
proxy_next_upstream off;

# Los headers de seguridad los pone nginx (cabeceras.conf) con los mismos valores: sin duplicados.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Content-Security-Policy;
proxy_hide_header Cache-Control;
