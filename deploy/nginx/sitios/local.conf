# SOLO para probar el compose en una máquina local (docker-compose.local.yml): HTTP sin TLS y sin
# HSTS. Mismas rutas, límites, timeouts y headers que producción. Nunca en un servidor.
server {
    listen 80 default_server;
    server_name _;

    include /etc/nginx/gatekeeper/cabeceras.conf;
    include /etc/nginx/gatekeeper/errores.conf;
    include /etc/nginx/gatekeeper/rutas.conf;
}
