# Producción de Gatekeeper en una instancia EC2 (K55). Se usa a través de `gk-compose`, que instala
# deploy/instalar.sh y le pasa /etc/gatekeeper/compose.env y /var/lib/gatekeeper/imagen.env.
#
# Servicios: nginx (443, TLS y la API), nginx-http (80: solo el desafío de Let's Encrypt y la redirección,
# con su propio pool de conexiones), api, postgres, migrate (perfil `migrar`, una sola ejecución), sonda
# (perfil `sonda`, sin red ni secretos) y certbot (perfil `certbot`, lo lanza un timer de systemd).
# Solo los dos nginx publican puertos.
#
# Redes: `publica` (los puertos), `frontend` (nginx y api, interna), `backend` (api, postgres y migrate,
# interna) y `acme` (solo certbot, con salida a Let's Encrypt). La API no tiene salida a internet.
#
# Memoria (t3.small, 2 GiB): api 1 GiB (uvicorn ~100 MiB + 2 hijos del CDR; RLIMIT_AS de 1 GiB por hijo,
# K31, pero un JPEG o PNG de 40 MP pesa ~330 MiB de RSS medidos), postgres 256 MiB, nginx 64 MiB,
# nginx-http 32 MiB y certbot 192 MiB solo mientras renueva. Queda ~0.5 GiB para el sistema y Docker.
# Si un hijo se pasa, el OOM del cgroup mata al proceso más grande (un hijo) y el archivo queda en
# `error` (INV-09).
#
# Sin secretos aquí: llegan por env_file desde /etc/gatekeeper/ (modo 0600, fuera del repo).

name: gatekeeper

x-endurecido: &endurecido
  read_only: true
  cap_drop: [ALL]
  # Perfil seccomp por defecto de Docker: permite landlock_* (444-446), seccomp() y prctl, que necesita
  # el hijo del CDR (K53, K54). Comprobado en la verificación; nunca `seccomp=unconfined` ni `privileged`.
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  nginx:
    <<: *endurecido
    image: nginx:1.30.7-alpine@sha256:b24de00298eb7fb23839442d46c780991be7bc7ddb081b6c0876ac777012e352
    # Sin el entrypoint de la imagen: sus scripts intentan reescribir la configuración.
    entrypoint: ["nginx", "-g", "daemon off;"]
    # El maestro lee los certificados como root y baja a `nginx` en los workers; crea y da a ese
    # usuario sus directorios temporales. Nada más.
    cap_add: [CHOWN, SETGID, SETUID]
    # Solo 443: el puerto 80, abierto a todo internet, va en nginx-http y no comparte sus conexiones.
    ports:
      - "443:443"
    networks: [publica, frontend]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/gatekeeper:/etc/nginx/gatekeeper:ro
      - ./nginx/sitios/produccion.conf:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
    tmpfs:
      - /var/cache/nginx:size=16m
      - /tmp:size=8m
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 64m
    memswap_limit: 64m
    pids_limit: 32

  # Puerto 80: el desafío HTTP-01 de Let's Encrypt y la redirección al dominio fijo. Contenedor aparte,
  # con su propio pool y timeouts cortos: conexiones a medias aquí no tumban el 443. No habla con la API.
  # También sirve el desafío del primer certificado, cuando el nginx del 443 aún no puede arrancar.
  nginx-http:
    <<: *endurecido
    image: nginx:1.30.7-alpine@sha256:b24de00298eb7fb23839442d46c780991be7bc7ddb081b6c0876ac777012e352
    entrypoint: ["nginx", "-g", "daemon off;"]
    cap_add: [CHOWN, SETGID, SETUID]
    ports:
      - "80:80"
    networks: [publica]
    volumes:
      - ./nginx/http.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/gatekeeper:/etc/nginx/gatekeeper:ro
      # `server_name <dominio>;`, lo escribe instalar.sh: la redirección nunca usa el Host del cliente.
      - ./nginx/generado/dominio.conf:/etc/nginx/generado/dominio.conf:ro
      - certbot_www:/var/www/certbot:ro
    tmpfs:
      - /var/cache/nginx:size=8m
      - /tmp:size=8m
    mem_limit: 32m
    memswap_limit: 32m
    pids_limit: 16

  api:
    <<: *endurecido
    image: ${GATEKEEPER_IMAGEN:?Define GATEKEEPER_IMAGEN (lo hace gk-compose)}
    user: "10001:10001"
    # Sin `init: true`: tini sería el padre de uvicorn con el pepper y la URL de la BD en su entorno,
    # y la API se negaría a arrancar (K52). uvicorn es el PID 1 (CMD de la imagen).
    env_file:
      - ${GATEKEEPER_ETC:-/etc/gatekeeper}/api.env
    environment:
      GATEKEEPER_DATOS: /datos
    volumes:
      - datos:/datos
    tmpfs:
      - /tmp:size=64m
    networks: [frontend, backend]
    depends_on:
      postgres:
        condition: service_healthy
    # Sin swap: un hijo que se pasa muere y su archivo termina en `error`, en vez de arrastrar al resto.
    mem_limit: 1g
    memswap_limit: 1g
    # uvicorn y sus hilos + 2 hijos del CDR (uno por núcleo, K09) con los hilos de Pillow.
    pids_limit: 128
    # Da tiempo a cancelar los análisis en curso (matan su grupo de procesos) al apagar.
    stop_grace_period: 20s

  postgres:
    <<: *endurecido
    image: postgres:16.16-bookworm@sha256:a49f7438ba03589f9b1ca062f2da82e899b48ea1dc50d2449fa09a70be83ebca
    # Directamente como `postgres`: el entrypoint no necesita root ni capacidades para cambiar de usuario.
    user: "999:999"
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=40
    env_file:
      - ${GATEKEEPER_ETC:-/etc/gatekeeper}/postgres.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    tmpfs:
      - /var/run/postgresql:size=1m,uid=999,gid=999,mode=0770
      - /tmp:size=16m
    shm_size: 64m
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -q"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 100
    stop_grace_period: 30s

  migrate:
    <<: *endurecido
    image: ${GATEKEEPER_IMAGEN:?Define GATEKEEPER_IMAGEN (lo hace gk-compose)}
    profiles: [migrar]
    restart: "no"
    user: "10001:10001"
    # Solo la URL de migración (rol dueño del esquema). Mientras no exista gk_app (migración 0002), la
    # API usa el mismo rol: ver README, "Limitaciones de esta etapa".
    env_file:
      - ${GATEKEEPER_ETC:-/etc/gatekeeper}/migrate.env
    command: ["/app/.venv/bin/alembic", "-c", "api/migrations/alembic.ini", "upgrade", "head"]
    healthcheck:
      disable: true
    tmpfs:
      - /tmp:size=16m
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 32

  # Sonda del aislamiento (deploy/sonda_aislamiento.py) con la misma imagen y el mismo endurecimiento que
  # la API, pero sin red, sin secretos y sin el volumen de datos. La corre actualizar.sh tras verificar
  # la firma de la imagen.
  sonda:
    <<: *endurecido
    image: ${GATEKEEPER_IMAGEN:?Define GATEKEEPER_IMAGEN (lo hace gk-compose)}
    profiles: [sonda]
    restart: "no"
    user: "10001:10001"
    network_mode: none
    healthcheck:
      disable: true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 32

  certbot:
    <<: *endurecido
    image: certbot/certbot:v5.10.0@sha256:c5698da859429ccee0fcc299a8000368198222d1f9e789ab6e388b491e8ce06d
    profiles: [certbot]
    restart: "no"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    tmpfs:
      - /var/lib/letsencrypt:size=16m
      - /var/log/letsencrypt:size=16m
      - /tmp:size=16m
    # Red propia con salida a internet: habla con Let's Encrypt y con nada de Gatekeeper.
    networks: [acme]
    mem_limit: 192m
    memswap_limit: 192m
    pids_limit: 32

networks:
  # Con salida a internet solo `publica` (los puertos publicados de los dos nginx) y `acme` (certbot).
  publica: {}
  # Internas, sin salida a internet: nginx con api, y api con postgres y migrate.
  frontend:
    internal: true
  backend:
    internal: true
  acme: {}

volumes:
  datos: {}
  pgdata: {}
  letsencrypt: {}
  certbot_www: {}
