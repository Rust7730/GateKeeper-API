# nginx del puerto 80 (servicio nginx-http). Abierto a todo internet porque Let's Encrypt valida desde
# direcciones desconocidas, así que va aparte del nginx del 443: su propio pool de conexiones y timeouts
# cortos. No habla con la API: solo sirve el desafío HTTP-01 y redirige a HTTPS.
user nginx;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    default_type text/plain;

    log_format gatekeeper '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent $request_time';
    access_log /dev/stdout gatekeeper;

    # Aquí nadie sube nada: cabeceras pequeñas, sin cuerpo y conexiones cortas. Una conexión que no
    # termina sus cabeceras en 5 s se cierra. El límite de conexiones por IP lo pone el cortafuegos
    # del host (deploy/cortafuegos.sh).
    client_header_timeout 5s;
    client_body_timeout 5s;
    send_timeout 10s;
    keepalive_timeout 5s;
    client_max_body_size 1k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 4k;

    # Cualquier Host que no sea el dominio: solo el desafío; lo demás, 404. Nunca se redirige al Host
    # que manda el cliente.
    server {
        listen 80 default_server;
        server_name _;

        include /etc/nginx/gatekeeper/cabeceras.conf;
        include /etc/nginx/gatekeeper/errores.conf;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        location / {
            return 404;
        }
    }

    # El dominio del servidor, escrito por instalar.sh: `server_name <dominio>;`.
    server {
        listen 80;
        include /etc/nginx/generado/dominio.conf;

        include /etc/nginx/gatekeeper/cabeceras.conf;
        include /etc/nginx/gatekeeper/errores.conf;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # $server_name es el dominio fijo de dominio.conf, no el Host del cliente.
        location / {
            return 301 https://$server_name$request_uri;
        }
    }
}
