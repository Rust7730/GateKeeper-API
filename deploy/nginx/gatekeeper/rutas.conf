# Lista blanca de rutas hacia la API. Todo lo demás es 404 en nginx.
location /v1/ {
    include /etc/nginx/gatekeeper/proxy.conf;
}

location = /health {
    include /etc/nginx/gatekeeper/proxy.conf;
}

# K29: la API solo sirve /openapi.json con GATEKEEPER_DOCS=1 y responde 404 en otro caso. nginx no
# duplica la decisión: la única fuente es esa variable, que /etc/gatekeeper/api.env no define.
location = /openapi.json {
    include /etc/nginx/gatekeeper/proxy.conf;
}

location / {
    return 404;
}
